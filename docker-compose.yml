# backend와 ai-server를 함께 띄웁니다. ai-server는 Docker 내부 네트워크에서만 접근합니다.
# frontend는 실행할 앱이 준비되면 추가합니다.
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_SERVER_URL: http://ai-server:8001
    depends_on:
      ai-server:
        condition: service_healthy

  ai-server:
    build: ./ai-server
    expose:
      - "8001"
