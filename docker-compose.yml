# backend와 ai-server를 함께 띄웁니다. ai-server는 Docker 내부 네트워크에서만 접근합니다.
# frontend는 127.0.0.1:8080에서 화면을 제공하고 /backend/ 요청을 backend로 전달합니다.
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_SERVER_URL: http://ai-server:8001
    depends_on:
      ai-server:
        condition: service_healthy

  ai-server:
    build: ./ai-server
    expose:
      - "8001"
