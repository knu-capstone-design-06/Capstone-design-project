# A disposable Postgres service checks the DB-mode invariants without Supabase credentials.
name: Backend DB integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The service is throwaway and accepts local connections only. No real DB URL is used.
      TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://kiosk_backend@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Prepare schema from repository migrations and seed
        run: python tests/setup_postgres_ci.py
      - name: Restart replay, concurrent order, and voice rollback
        run: python -m unittest tests.test_postgres_ordering -v
