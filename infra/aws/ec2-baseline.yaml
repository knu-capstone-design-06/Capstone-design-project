AWSTemplateFormatVersion: '2010-09-09'
Description: Initial EC2 host for the capstone backend and AI server; no public inbound ports.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC containing the chosen public subnet.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with a route to an internet gateway.
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: AL2023 AMI ID fixed at stack creation; change only for an intentional instance replacement.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small

Resources:
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: capstone-design

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2Role

  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Capstone EC2 host - no inbound rules; default egress allows all outbound traffic
      VpcId: !Ref VpcId
      Tags:
        - Key: Project
          Value: capstone-design

  Ec2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Ec2InstanceProfile
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      Monitoring: false
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref Ec2SecurityGroup
          SubnetId: !Ref SubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 30
            VolumeType: gp3
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
      Tags:
        - Key: Name
          Value: capstone-api-dev
        - Key: Project
          Value: capstone-design
        - Key: Environment
          Value: development

Outputs:
  InstanceId:
    Description: Connect through Systems Manager Session Manager.
    Value: !Ref Ec2Instance
  SecurityGroupId:
    Value: !Ref Ec2SecurityGroup
  PublicIp:
    Description: Used for outbound access; the security group has no inbound rules.
    Value: !GetAtt Ec2Instance.PublicIp
