openapi: 3.1.0
info:
  title: Voice API
  version: 0.2.0
  description: |
    음성 요청을 backend로 전달하는 API 명세입니다. (상태: 팀 검토 전 제안)
    근거 문서: docs/Voice-MCP-Implementation.md

    STT(음성 → 텍스트)
    - frontend가 Chrome 내장 Web Speech API(SpeechRecognition, ko-KR)로 변환하고 텍스트만 보냅니다.
      인식 시작·종료 방식(말 끝 감지, 버튼 등)은 frontend가 정합니다.
    - 서버 STT(Whisper 등)와 녹음 파일 업로드는 사용하지 않습니다. Chrome 인식을 쓸 수 없으면 터치로 주문합니다.

    처리 원칙
    - 음성 요청(voice/requests)은 접수만 하고 바로 응답합니다. backend가 OpenAI API로 맥락을 해석해
      MCP 장바구니 도구의 입력(tool_calls)으로 바꿉니다. 이 API는 도구를 실행하지 않습니다.
      MCP 도구가 tool_calls를 실행해 장바구니를 바꾸고, 그 결과는 알림 채널(SSE, 별도 명세)로 전달합니다.
    - tool_calls는 손님에게 보이는 문장이 아닙니다. 손님에게 보이는 문장은 확인·질문·실패 안내(reply_text)뿐이며,
      화면에서 한눈에 읽히도록 해요체 한 문장(최대 60자)으로 짧게 씁니다.
    - 이용자 맥락: 세션마다 최근 10턴(발화와 해석 결과)을 함께 넘겨 "그거", "하나 더" 같은 말을 해석합니다.
      이 기록은 세션 동안 backend 메모리에만 두고 로그에 남기지 않으며, 재시작하면 사라집니다. 실패한 요청은 기록하지 않습니다.
    - 확실하면 바로 completed, 애매하면(인식 신뢰도 낮음, 맥락으로 추측 등) 이해한 내용을 needs_confirmation으로 확인받고,
      정할 수 없으면 needs_clarification으로 묻습니다.
    - 확인·질문에 대한 사용자의 대답("네", "아니 따뜻한 걸로")은 같은 세션의 다음 음성 요청으로 보냅니다.
      확인 버튼 같은 UI와 제안된 tool_calls를 언제 적용할지는 부르는 쪽이 정합니다.
    - 외부 AI API(OpenAI)는 backend가 호출합니다. frontend는 backend의 이 API만 호출합니다.
    - 음성 처리가 실패해도 터치 주문은 계속 동작해야 합니다.

    길이·동시 요청 수 등 제한값은 제안값이며 팀 합의 후 확정합니다.
servers:
  - url: http://localhost:8000
    description: backend 직접 호출 (docker compose)
  - url: http://localhost:8080/backend
    description: frontend nginx 프록시 경유 (docker compose)

paths:
  /api/v1/sessions/{session_id}/voice/requests:
    post:
      summary: 음성 요청 접수 (인식된 텍스트 전달)
      description: |
        frontend가 인식한 텍스트와 후보를 보내면 즉시 202를 반환합니다.
        backend는 OpenAI API로 해석한 MCP 도구 입력(tool_calls) 또는 확인 질문을 아래 상태 조회 API로 전달합니다.
        해석에는 판매 중인 상품 목록(product_id·이름·허용 온도)을 함께 넘기고, 목록에 없는 상품·온도는 실패로 처리합니다.
        - 한 세션에서 처리 중인 음성 요청은 1개만 허용합니다. 처리 중에 새 요청이 오면 409입니다.
        - 같은 `Idempotency-Key`로 재시도하면 새로 접수하지 않고 처음 접수 결과를 반환합니다.
      operationId: createVoiceRequest
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceRequestCreate"
            examples:
              chrome:
                summary: Chrome 인식 결과 (후보 포함)
                value:
                  text: 아이스 아메리카노 두 개 담고 결제로 가줘
                  alternatives:
                    - { text: 아이스 아메리카노 두 개 담고 결제로 가줘, confidence: 0.91 }
                    - { text: 아이스 아메리카노 도 개 담고 결제로 가줘, confidence: 0.42 }
                  screen_id: menu_list
              no_alternatives:
                summary: 후보가 없는 경우
                value:
                  text: 라떼 하나
                  alternatives: []
                  screen_id: menu_list
      responses:
        "202":
          description: 접수됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceRequestAccepted"
              example:
                request_id: vr_01J9Z3K8
                status: accepted
                accepted_at: "2026-10-07T10:00:00Z"
        "404":
          description: 없는 세션
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceErrorResponse" }
              example: { code: session_not_found, detail: 세션을 찾을 수 없습니다. }
        "409":
          description: 이미 처리 중인 요청이 있음, 또는 같은 키에 다른 내용
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceErrorResponse" }
              examples:
                in_progress:
                  value: { code: request_in_progress, detail: 이전 음성 요청을 처리하고 있습니다. }
                key_reused:
                  value: { code: idempotency_key_reused, detail: 같은 키로 다른 요청을 보냈습니다. }
        "422":
          description: 요청 형식 오류 (빈 텍스트, 범위 밖 신뢰도 등)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceErrorResponse" }
              example: { code: invalid_request, detail: text가 비어 있습니다. }
        "503":
          description: 외부 AI 일시 불가
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceErrorResponse" }
              example: { code: ai_unavailable, detail: 음성 요청을 잠시 처리할 수 없습니다. }

  /api/v1/sessions/{session_id}/voice/requests/{request_id}:
    get:
      summary: 음성 요청 처리 상태 조회
      description: |
        알림 채널을 쓰지 못할 때(연결 끊김, 개발 중 확인)의 대안입니다. 1초 이상 간격으로 조회합니다.
        장바구니 내용은 장바구니 조회 API로 다시 확인합니다.
      operationId: getVoiceRequest
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: request_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 현재 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceRequestStatus"
              examples:
                processing:
                  value: { request_id: vr_01J9Z3K8, status: processing, reply_text: null, tool_calls: [], actions: [], error: null }
                completed:
                  value:
                    request_id: vr_01J9Z3K8
                    status: completed
                    reply_text: null
                    tool_calls:
                      - tool: add_cart_item
                        arguments: { product_id: americano, temperature: iced, quantity: 2 }
                    actions: []
                    error: null
                needs_confirmation:
                  summary: 애매해서 이해한 내용을 확인 (tool_calls는 제안, 아직 실행하지 않음)
                  value:
                    request_id: vr_01J9Z3KB
                    status: needs_confirmation
                    reply_text: 아이스 아메리카노 2잔 담을까요?
                    tool_calls:
                      - tool: add_cart_item
                        arguments: { product_id: americano, temperature: iced, quantity: 2 }
                    actions: []
                    error: null
                needs_clarification:
                  value:
                    request_id: vr_01J9Z3K9
                    status: needs_clarification
                    reply_text: 라떼는 아이스, 따뜻한 것 중 무엇으로 할까요?
                    tool_calls: []
                    actions: []
                    error: null
                failed:
                  value:
                    request_id: vr_01J9Z3KA
                    status: failed
                    reply_text: 지금은 음성 주문이 어려워요. 화면을 눌러 주문해 주세요.
                    tool_calls: []
                    actions: []
                    error: { code: ai_unavailable, detail: 외부 AI 응답 시간 초과 }
        "404":
          description: 없는 세션 또는 요청
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceErrorResponse" }
              example: { code: voice_request_not_found, detail: 음성 요청을 찾을 수 없습니다. }

components:
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 사용자 발화마다 frontend가 만드는 UUID. 응답을 못 받아 재시도할 때만 같은 값을 씁니다.
      schema: { type: string, format: uuid }

  schemas:
    VoiceRequestCreate:
      type: object
      required: [text, alternatives, screen_id]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: 최종 인식 문장 (가장 신뢰도 높은 후보)
        alternatives:
          type: array
          maxItems: 5
          description: |
            인식 후보와 신뢰도 (Chrome SpeechRecognition의 maxAlternatives 결과, 신뢰도 높은 순).
            backend는 OpenAI 해석 시 맥락으로 함께 사용합니다. 후보가 없으면 빈 배열.
          items:
            $ref: "#/components/schemas/RecognitionAlternative"
        screen_id:
          type: string
          description: 요청 시점의 화면 ID (터치 로그와 같은 값 사용)

    RecognitionAlternative:
      type: object
      required: [text, confidence]
      properties:
        text: { type: string, maxLength: 500 }
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: 0~1. 브라우저가 값을 주지 않으면 null

    VoiceRequestAccepted:
      type: object
      required: [request_id, status, accepted_at]
      properties:
        request_id: { type: string }
        status: { type: string, const: accepted }
        accepted_at: { type: string, format: date-time }

    VoiceRequestStatus:
      type: object
      required: [request_id, status, reply_text, tool_calls, actions, error]
      properties:
        request_id: { type: string }
        status:
          type: string
          enum: [accepted, processing, completed, needs_confirmation, needs_clarification, failed]
          description: |
            accepted=접수됨, processing=해석 중,
            completed=확실하게 해석함(tool_calls를 바로 MCP로 처리 가능),
            needs_confirmation=해석했지만 애매함(tool_calls는 제안, reply_text로 확인받은 뒤 처리),
            needs_clarification=정할 수 없어 질문 필요(tool_calls 없음), failed=실패.
            확인·질문에 대한 대답은 같은 세션의 다음 음성 요청으로 보냅니다.
        reply_text:
          type: [string, "null"]
          maxLength: 60
          description: |
            사용자에게 보여주거나 읽어 줄 짧은 문장(해요체 한 문장). needs_confirmation의 확인,
            needs_clarification의 질문, failed의 안내에만 값이 있고 completed에서는 null입니다.
            읽는 방식(TTS)은 부르는 쪽이 정합니다.
        tool_calls:
          type: array
          maxItems: 10
          description: |
            MCP 장바구니 도구의 입력. 말한 순서대로 실행합니다. completed에서는 바로 처리할 입력,
            needs_confirmation에서는 확인 전 제안이고, 그 밖의 상태에서는 빈 배열입니다.
            item_id·expected_version·Idempotency-Key는 넣지 않으며, MCP 도구가 장바구니를 조회해 정합니다.
          items:
            $ref: "#/components/schemas/VoiceToolCall"
        actions:
          type: array
          description: |
            이 요청으로 발생한 알림 이벤트 종류 (알림 채널 명세의 event 이름).
            이 API는 도구를 실행하지 않으므로 현재는 항상 빈 배열입니다.
          items:
            type: string
            enum: [cart_updated, ui_changed, confirmation_required]
        error:
          oneOf:
            - $ref: "#/components/schemas/VoiceErrorResponse"
            - type: "null"

    VoiceToolCall:
      description: 도구 이름은 docs/Voice-MCP-Implementation.md 3.2의 예시를 따릅니다(팀 합의 전 제안).
      oneOf:
        - $ref: "#/components/schemas/AddCartItemCall"
        - $ref: "#/components/schemas/UpdateCartItemCall"
        - $ref: "#/components/schemas/RemoveCartItemCall"
      discriminator:
        propertyName: tool

    AddCartItemCall:
      type: object
      required: [tool, arguments]
      additionalProperties: false
      properties:
        tool: { type: string, const: add_cart_item }
        arguments: { $ref: "#/components/schemas/CartItemQuantity" }

    UpdateCartItemCall:
      type: object
      required: [tool, arguments]
      additionalProperties: false
      description: quantity는 바뀐 뒤의 전체 개수(절대값)입니다.
      properties:
        tool: { type: string, const: update_cart_item }
        arguments: { $ref: "#/components/schemas/CartItemQuantity" }

    RemoveCartItemCall:
      type: object
      required: [tool, arguments]
      additionalProperties: false
      properties:
        tool: { type: string, const: remove_cart_item }
        arguments: { $ref: "#/components/schemas/CartItemTarget" }

    CartItemTarget:
      type: object
      required: [product_id, temperature]
      additionalProperties: false
      description: 장바구니 항목은 상품과 온도 조합으로 지정합니다(docs/Product-Cart-Order-API-Draft.md).
      properties:
        product_id: { type: string, description: 상품 목록에 있는 상품 ID }
        temperature:
          type: [string, "null"]
          enum: [iced, hot, null]
          description: 상품의 허용 온도 중 하나. 온도가 없는 상품은 null

    CartItemQuantity:
      type: object
      required: [product_id, temperature, quantity]
      additionalProperties: false
      properties:
        product_id: { type: string, description: 상품 목록에 있는 상품 ID }
        temperature:
          type: [string, "null"]
          enum: [iced, hot, null]
          description: 상품의 허용 온도 중 하나. 온도가 없는 상품은 null
        quantity: { type: integer, minimum: 1, maximum: 20 }

    VoiceErrorResponse:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - session_not_found
            - voice_request_not_found
            - request_in_progress
            - idempotency_key_reused
            - ai_unavailable
          description: frontend 분기용 오류 코드
        detail:
          type: string
          description: 오류 설명. 내부 예외·키·외부 API 응답 원문은 넣지 않습니다.
