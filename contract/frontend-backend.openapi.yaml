openapi: 3.1.0
info:
  title: Frontend ↔ Backend API
  version: 0.4.1
  x-order-api-status: draft
  description: |
    React 키오스크(frontend)와 FastAPI backend 사이의 API 명세입니다.
    frontend는 터치 통계를 backend(/features)에 보내고, VITE_AI_ENGINE_URL을 설정하면 같은 PC의 AI 엔진 터치 입구(frontend-ai.openapi.json)에도 보냅니다. 그 밖의 API는 backend와만 통신합니다.
    AI 엔진은 창마다 상황 태그를 backend로 보내고(ai-backend.openapi.json), backend가 판단합니다. (팀 논문 그림 1)
    0.1.0의 상태·연결·세션·특징 API 형식을 유지하고 상품·서버 장바구니·모의 주문 API를 추가합니다.
    첫 시연 정책 A·B·C(고정 17개 상품·현재 가격·옵션·항목별 최대 20개,
    실제 결제·재고 차감 없는 모의 주문, 한 세션당 주문 1건과 새 주문 시 새 세션)는
    2026-10-15 백엔드 담당자의 명시적 결정에 따라 채택했습니다.
    나머지 주문 API 정책은 팀 검토용 초안이며 각 operation의 x-contract-status=draft를 유지합니다.
    각 operation의 x-frontend-status(프론트 준비)·x-backend-status(서버 구현)는 구현 상태 표시이며 계약 합의를 뜻하지 않습니다.
    각 상태 표시는 해당 프론트엔드·백엔드 담당자가 구현 변경 시 갱신합니다.
    세션 접근·인증·만료·복원, 멱등성 키 보관·처리 중·실패 정책,
    주문번호 형식·서버 저장 방식은 별도 합의가 필요합니다.
    명세 추가는 구현 완료나 팀 합의를 뜻하지 않습니다. 음성 요청 API는 contract/voice.openapi.yaml에 따로 적습니다.
    실제 결제와 알림 채널(SSE 등) 연동은 이후 범위입니다.
servers:
  - url: http://localhost:8000
    description: docker compose 로컬 실행
  - url: http://localhost:8080/backend
    description: |
      frontend nginx 프록시 경유 (docker compose). 브라우저 frontend는 backend를 이 경로로만 호출합니다.
      Vite 개발 서버도 같은 /backend 경로를 backend로 전달합니다.

paths:
  /health:
    get:
      summary: backend 프로세스 상태 확인
      operationId: getBackendHealth
      x-frontend-status: client-only
      x-backend-status: implemented
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example: { status: ok, service: backend }

  /api/v1/connectivity:
    get:
      summary: backend → ai-engine 연결 확인 (Docker 네트워크 확인용)
      operationId: getConnectivity
      x-frontend-status: client-only
      x-backend-status: implemented
      responses:
        "200":
          description: 확인 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectivityResponse"
              example: { backend: ok, ai_engine: ok }

  /api/v1/sessions:
    post:
      summary: 키오스크 이용 세션 시작
      operationId: createSession
      x-frontend-status: prepared
      x-backend-status: implemented
      description: |
        요청 본문 없이 기존 session_id·started_at 응답을 사용합니다.
        지금 backend는 장바구니·주문 요청의 세션도 이 세션 ID로 확인합니다.
        프론트는 새로고침·새 주문·주문 재시작·결과 재확인 실패 후 처음부터 다시 시작할 때 새 세션을 요청합니다.
        Cart 조회 실패 후 재연결도 새 세션을 요청하며 기존 세션을 재사용하거나 자동 종료하지 않습니다.
        첫 시연에서는 한 세션에 모의 주문 한 건만 만들고 새 주문은 새 세션에서 시작합니다.
        주문 완료 뒤 Cart 조회·새 변경은 410 session_expired이며, 이미 성공한 동일 키·동일 요청의 재전송은 원래 성공 응답을 반환합니다.
        주문 완료 뒤 새 특징 전송과 새 음성 요청 접수는 410 session_expired로 거절합니다.
        기존 음성 요청의 결과 조회와 보관 중인 동일 키·동일 요청의 접수 응답 재전송은 허용합니다.
        세션의 시간 만료·복원·접근 및 인증 정책은 공개 배포 전 별도 합의가 필요합니다.
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreateResponse"
              example:
                session_id: 3f2c9a0e7b1d4c5e8f6a2b1c0d9e8f7a
                started_at: "2026-10-01T10:00:00Z"

  /api/v1/sessions/{session_id}/features:
    post:
      summary: 시간 구간 특징 전송 → 불편 상태와 지원 방식 응답
      description: |
        frontend가 1~3초 구간마다 터치 통계를 보냅니다. VITE_AI_ENGINE_URL을 설정하면 같은 창을 같은 PC의 AI 엔진에도 보냅니다(frontend-ai.openapi.json).
        비전 값은 AI 엔진이 창마다 backend로 직접 보냅니다(ai-backend.openapi.json). vision 필드는 계약에 그대로 있고 주문 화면은 null로 보냅니다.
        backend는 터치 통계와 짝 지은 AI 엔진 창으로 지원 방식을 판단하고, 불편 상태 점수(states)는 ai-engine의 /v1/analyze에서 받습니다. 판단 결과는 아래 시연 스위치를 켰을 때만 support에 실립니다.
        ai-engine 호출이 실패하면 ai_available=false, states=null, model_version=null, preset=none으로 응답합니다.
        다만 backend의 시연 스위치 DECISION_SEND_SUPPORT를 켜면 support는 ai-engine 호출 결과와 관계없이 판단 층의 결정을 싣습니다(SupportDecision). ai_available·states·model_version은 그대로 ai-engine 분석의 결과입니다.
        주문 완료 세션의 새 요청은 ai-engine 호출 전에 410 session_expired로 거절합니다.
        처리 중 주문이 완료되면 늦게 도착한 AI 결과도 410으로 버립니다.
        프론트는 주문 완료 뒤 주기 전송을 멈추고 이미 보낸 요청의 늦은 결과를 화면에 적용하지 않습니다.
      operationId: sendFeatureWindow
      x-frontend-status: client-only
      x-backend-status: implemented
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureWindowRequest"
            example:
              screen_id: menu
              window_start: "2026-10-01T10:00:00Z"
              window_end: "2026-10-01T10:00:03Z"
              touch: { tap_count: 6, miss_tap_count: 3, repeat_tap_count: 2, back_count: 0, dwell_ms: 3000 }
              vision: { face_detected: true, face_size_ratio: 0.35, assistive_device: false, confidence: 0.9 }
      responses:
        "200":
          description: 판단 결과. 예시의 support는 형식을 보여 주는 값입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureWindowResponse"
              example:
                session_id: 3f2c9a0e7b1d4c5e8f6a2b1c0d9e8f7a
                ai_available: true
                states: { normal: 0.167, touch_difficulty: 0.833, navigation_difficulty: 0, visual_difficulty: 0.056, hesitation: 0.1 }
                model_version: dummy-0.1
                support: { preset: large_button, requires_confirmation: true, decided_by: rule_placeholder }
        "404":
          description: 없는 세션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { detail: session not found }
        "410":
          description: 주문을 완료한 세션의 새 특징 전송 또는 처리 중 완료된 세션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { detail: session_expired }
        "422":
          description: 요청 형식 오류

  "/api/v1/products":
    "get":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "implemented"
      "tags": ["products"]
      "summary": "상품 목록 조회"
      "operationId": "getProducts"
      "description": "상품 전체를 조회하고 coffee/drink/food를 화면 분류 값으로 표시합니다. 첫 시연은 고정 17개 상품·현재 가격·온도 옵션을 사용합니다. backend는 DATABASE_URL이 있으면 kiosk.products(시드: db/seed/20261101_demo_catalog.sql)를, 없으면 backend/app/modules/ordering/catalog.py를 읽습니다. 프론트는 API의 가격·온도·판매 가능 여부를 사용합니다. 페이지네이션·검색·이미지 API는 포함하지 않습니다."
      "responses":
        "200":
          "description": "상품 목록."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ProductList"
              "example":
                "currency": "KRW"
                "products": [{"product_id":"americano","name":"아메리카노","category":"coffee","description":"깊고 깔끔한 에스프레소","unit_price":3500,"available":true,"temperatures":["iced","hot"]},{"product_id":"sandwich","name":"에그 샌드위치","category":"food","description":"든든한 달걀 샌드위치","unit_price":5500,"available":true,"temperatures":[]}]
        "503":
          "$ref": "#/components/responses/OrderUnavailable"
  "/api/v1/sessions/{session_id}/cart":
    "parameters": [{"$ref":"#/components/parameters/OrderSessionId"}]
    "get":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "implemented"
      "tags": ["cart"]
      "summary": "세션 장바구니 조회"
      "operationId": "getCart"
      "description": "현재 이용의 서버 장바구니를 조회합니다. 첫 시연용 프론트는 새로고침·새 주문 시작에 새 세션을 요청하고 해당 세션의 Cart를 조회합니다. 접근성 설정만 로컬에 유지하며 로컬 Cart로 서버를 덮어쓰지 않습니다. 이전 이용·완료 화면 복원은 후순위입니다."
      "responses":
        "200":
          "description": "조회 또는 변경 후 전체 서버 장바구니."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
              "examples":
                "cart":
                  "$ref": "#/components/examples/OrderCart"
                "empty":
                  "$ref": "#/components/examples/OrderEmptyCart"
        "404":
          "$ref": "#/components/responses/OrderNotFound"
        "410":
          "$ref": "#/components/responses/OrderSessionExpired"
        "422":
          "$ref": "#/components/responses/OrderInvalidRequest"
        "503":
          "$ref": "#/components/responses/OrderUnavailable"
  "/api/v1/sessions/{session_id}/cart/items":
    "parameters": [{"$ref":"#/components/parameters/OrderSessionId"}]
    "post":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "implemented"
      "tags": ["cart"]
      "summary": "상품 추가 또는 동일 상품·온도 수량 합산"
      "operationId": "addCartItem"
      "description": "백엔드가 상품·옵션·판매 가능 여부·수량을 검증하고 같은 상품·온도는 합산합니다. 첫 시연의 항목별 수량은 1~20개이며, 합산 20개 초과 시 409 quantity_limit_exceeded로 변경 전체를 거절합니다. 허용되지 않은 온도, 온도 선택이 필요한 음료의 temperature=null, 푸드의 온도 지정은 422 invalid_option 제안입니다. temperature 필드 자체의 누락·타입 오류는 422 invalid_request입니다. 서버 버전 확인·변경·결과 및 멱등성 기록의 원자적 처리는 백엔드 구현 범위입니다. 프론트는 성공 응답 후 전체 Cart를 표시합니다."
      "parameters": [{"$ref":"#/components/parameters/OrderIdempotencyKey"}]
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CartItemCreateRequest"
            "example":
              "product_id": "americano"
              "temperature": "iced"
              "quantity": 2
              "expected_version": 0
      "responses":
        "200":
          "description": "변경 후 전체 서버 장바구니."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
              "examples":
                "cart":
                  "$ref": "#/components/examples/OrderCartAfterAdd"
        "404":
          "$ref": "#/components/responses/OrderNotFound"
        "409":
          "$ref": "#/components/responses/OrderConflict"
        "410":
          "$ref": "#/components/responses/OrderSessionExpired"
        "422":
          "$ref": "#/components/responses/OrderInvalidRequest"
        "503":
          "$ref": "#/components/responses/OrderUnavailable"
  "/api/v1/sessions/{session_id}/cart/items/{item_id}":
    "parameters": [{"$ref":"#/components/parameters/OrderSessionId"},{"$ref":"#/components/parameters/OrderCartItemId"}]
    "patch":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "implemented"
      "tags": ["cart"]
      "summary": "장바구니 항목의 절대 수량 변경"
      "operationId": "updateCartItemQuantity"
      "description": "quantity는 변경 후 수량입니다. 0은 삭제로 처리하지 않습니다. 가격·판매 가능 여부를 검증하고 현재 적용 단가를 반환합니다. 버전 확인·변경·성공 응답 및 멱등성 키 저장은 원자적으로 처리합니다."
      "parameters": [{"$ref":"#/components/parameters/OrderIdempotencyKey"}]
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CartItemQuantityUpdateRequest"
            "example":
              "quantity": 3
              "expected_version": 2
      "responses":
        "200":
          "description": "변경 후 전체 서버 장바구니."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
              "examples":
                "cart":
                  "$ref": "#/components/examples/OrderCartAfterQuantityUpdate"
        "404":
          "$ref": "#/components/responses/OrderNotFound"
        "409":
          "$ref": "#/components/responses/OrderConflict"
        "410":
          "$ref": "#/components/responses/OrderSessionExpired"
        "422":
          "$ref": "#/components/responses/OrderInvalidRequest"
        "503":
          "$ref": "#/components/responses/OrderUnavailable"
    "delete":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "implemented"
      "tags": ["cart"]
      "summary": "장바구니 항목 삭제"
      "operationId": "deleteCartItem"
      "description": "본문 없이 expected_version 쿼리로 버전을 전달합니다. 삭제 후 전체 장바구니를 반환합니다. 버전 확인·변경·성공 응답 및 멱등성 키 저장은 원자적으로 처리합니다. 예시 요청은 item-2?expected_version=2 삭제이며, 응답은 아메리카노 항목만 남은 버전 3입니다."
      "parameters": [{"$ref":"#/components/parameters/OrderIdempotencyKey"},{"$ref":"#/components/parameters/OrderExpectedVersion"}]
      "responses":
        "200":
          "description": "변경 후 전체 서버 장바구니."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
              "examples":
                "cart":
                  "$ref": "#/components/examples/OrderCartAfterDelete"
        "404":
          "$ref": "#/components/responses/OrderNotFound"
        "409":
          "$ref": "#/components/responses/OrderConflict"
        "410":
          "$ref": "#/components/responses/OrderSessionExpired"
        "422":
          "$ref": "#/components/responses/OrderInvalidRequest"
        "503":
          "$ref": "#/components/responses/OrderUnavailable"
  "/api/v1/sessions/{session_id}/orders":
    "parameters": [{"$ref":"#/components/parameters/OrderSessionId"}]
    "post":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "implemented"
      "tags": ["orders"]
      "summary": "서버 장바구니를 모의 주문으로 확정"
      "operationId": "createSimulatedOrder"
      "description": "상품·가격을 요청에 다시 넣지 않고 서버 Cart를 기준으로 확정합니다. 서버의 상품·옵션·판매 가능 여부·버전 검증, 주문 스냅샷 저장·번호 발급·Cart 비우기·버전 증가·중복 방지 기록은 백엔드 구현 범위입니다. 프론트는 성공 응답의 주문번호를 그대로 표시하며 성공 전에 Cart를 비우지 않습니다. 첫 시연은 고정 가격의 실제 결제·재고 차감 없는 모의 주문이며 한 세션에 한 건만 허용합니다. 완료 세션의 Cart 조회·새 변경은 410 session_expired이고, 이미 성공한 동일 키·동일 요청은 원래 성공 응답을 재생하며, 새 주문은 새 세션에서 시작합니다. 동적 가격 변경 시 전체 Cart 가격·금액 갱신·버전 증가·재확인과 완료 화면 복원은 후순위 검토 방향입니다."
      "parameters": [{"$ref":"#/components/parameters/OrderIdempotencyKey"}]
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/OrderCreateRequest"
            "example":
              "expected_version": 2
      "responses":
        "201":
          "description": "모의 주문 생성. 성공한 동일 요청의 재시도에도 동일 상태 코드와 원래 응답을 반환합니다."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
              "examples":
                "order":
                  "$ref": "#/components/examples/SimulatedOrder"
        "404":
          "$ref": "#/components/responses/OrderNotFound"
        "409":
          "$ref": "#/components/responses/OrderConflict"
        "410":
          "$ref": "#/components/responses/OrderSessionExpired"
        "422":
          "$ref": "#/components/responses/OrderInvalidRequest"
        "503":
          "$ref": "#/components/responses/OrderUnavailable"

components:
  "parameters":
    "OrderSessionId":
      "name": "session_id"
      "in": "path"
      "required": true
      "description": "기존 POST /api/v1/sessions가 반환하는 서버 세션 ID. 같은 세션을 Cart·Order에도 사용할 것을 제안합니다. 만료·접근·인증·보관 정책은 미정입니다."
      "schema":
        "type": "string"
        "minLength": 1
    "OrderCartItemId":
      "name": "item_id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "minLength": 1
    "OrderExpectedVersion":
      "name": "expected_version"
      "in": "query"
      "required": true
      "description": "DELETE 요청의 마지막으로 조회한 장바구니 버전."
      "schema":
        "type": "integer"
        "minimum": 0
    "OrderIdempotencyKey":
      "name": "Idempotency-Key"
      "in": "header"
      "required": true
      "description": "프론트는 사용자 동작마다 UUID를 생성합니다. 응답 유실의 수동 재시도에는 같은 키·경로·메서드·쿼리·버전·본문을 유지합니다. 성공한 동일 요청의 원래 응답 재생과 다른 요청에 같은 키를 재사용할 때의 409를 제안합니다. 버전 충돌 후 사용자가 최신 Cart로 재조작하면 새 키를 사용합니다. 세션 접근 검증과 결과 기록·재생은 백엔드 책임이며 보관 기간·처리 중 오류 코드·실패 응답 재사용 정책은 팀 합의가 필요합니다. 세션 생성에는 이 헤더를 새로 요구하지 않습니다."
      "schema":
        "type": "string"
        "format": "uuid"
  "responses":
    "OrderNotFound":
      "description": "세션·상품·장바구니 항목 없음. 해당 요청에 해당하는 코드만 반환합니다."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/OrderApiError"
          "examples":
            "session_not_found":
              "value":
                "code": "session_not_found"
                "detail": "세션을 찾을 수 없습니다."
                "cart": null
            "product_not_found":
              "value":
                "code": "product_not_found"
                "detail": "상품을 찾을 수 없습니다."
                "cart": null
            "cart_item_not_found":
              "value":
                "code": "cart_item_not_found"
                "detail": "장바구니 항목을 찾을 수 없습니다."
                "cart": null
    "OrderSessionExpired":
      "description": "주문 완료 세션의 장바구니 조회와 새로운 변경 요청에 반환하는 410 session_expired 응답입니다. 이미 성공한 동일 Idempotency-Key·동일 요청의 재전송에는 원래 성공 응답을 반환합니다. 유휴 시간에 따른 세션 만료의 정확한 시간·안내·복구 정책은 후순위 검토 대상이며, 현재 시간 만료 구현을 뜻하지 않습니다."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/OrderApiError"
          "examples":
            "session_expired":
              "value":
                "code": "session_expired"
                "detail": "새 이용 세션을 시작해 주세요."
                "cart": null
    "OrderConflict":
      "description": "상태 충돌 응답의 제안입니다. 버전 충돌은 최신 Cart를 표시하고 사용자 재조작을 기다립니다. 주문 실패 시 주문 생성·Cart 비우기를 하지 않는 방향입니다. price_changed는 후순위 동적 가격 변경 예시입니다. 처리 중 중복에 409와 Retry-After를 제공하는 방향은 검토 중이며 구체적인 오류 코드는 합의 후 추가합니다."
      "headers":
        "Retry-After":
          "description": "처리 중 중복 요청에 선택적으로 지원할 재시도 대기 시간(초) 제안. 프론트는 값이 있으면 새 변경을 막고 같은 요청으로 수동 재시도합니다. 서버 지원·오류 코드·대기 시간은 미정입니다."
          "schema":
            "type": "integer"
            "minimum": 0
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/OrderApiError"
          "examples":
            "cart_version_conflict":
              "value":
                "code": "cart_version_conflict"
                "detail": "장바구니가 변경되었습니다. 최신 내용을 확인해 주세요."
                "cart":
                  "session_id": "session-1"
                  "version": 2
                  "currency": "KRW"
                  "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3500,"line_amount":7000},{"item_id":"item-2","product_id":"sandwich","name":"에그 샌드위치","temperature":null,"quantity":1,"unit_price":5500,"line_amount":5500}]
                  "total_quantity": 3
                  "total_amount": 12500
                  "updated_at": "2026-10-07T05:01:00Z"
            "price_changed":
              "value":
                "code": "price_changed"
                "detail": "상품 가격이 변경되었습니다. 최신 금액을 확인해 주세요."
                "cart":
                  "session_id": "session-1"
                  "version": 3
                  "currency": "KRW"
                  "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3800,"line_amount":7600},{"item_id":"item-2","product_id":"sandwich","name":"에그 샌드위치","temperature":null,"quantity":1,"unit_price":5500,"line_amount":5500}]
                  "total_quantity": 3
                  "total_amount": 13100
                  "updated_at": "2026-10-07T05:01:00Z"
            "product_unavailable":
              "value":
                "code": "product_unavailable"
                "detail": "현재 주문할 수 없는 상품입니다."
                "cart": null
            "quantity_limit_exceeded":
              "value":
                "code": "quantity_limit_exceeded"
                "detail": "장바구니 항목의 수량 한도를 초과했습니다."
                "cart":
                  "session_id": "session-1"
                  "version": 1
                  "currency": "KRW"
                  "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":20,"unit_price":3500,"line_amount":70000}]
                  "total_quantity": 20
                  "total_amount": 70000
                  "updated_at": "2026-10-07T05:01:00Z"
            "empty_cart":
              "value":
                "code": "empty_cart"
                "detail": "빈 장바구니로 주문할 수 없습니다."
                "cart":
                  "session_id": "session-1"
                  "version": 0
                  "currency": "KRW"
                  "items": []
                  "total_quantity": 0
                  "total_amount": 0
                  "updated_at": "2026-10-07T05:00:00Z"
            "idempotency_key_reused":
              "value":
                "code": "idempotency_key_reused"
                "detail": "같은 중복 방지 키에 다른 요청을 사용할 수 없습니다."
                "cart": null
    "OrderInvalidRequest":
      "description": "필수 필드·헤더·타입·수량 오류는 invalid_request, 상품에 허용되지 않은 온도(온도 필수 음료의 null 또는 푸드의 온도 지정 포함)는 invalid_option 제안입니다. 신규 API의 검증 오류도 이 형식을 사용합니다."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/OrderApiError"
          "examples":
            "invalid_request":
              "value":
                "code": "invalid_request"
                "detail": "요청 형식이 올바르지 않습니다."
                "cart": null
            "invalid_option":
              "value":
                "code": "invalid_option"
                "detail": "이 상품에서 선택할 수 없는 온도입니다."
                "cart": null
    "OrderUnavailable":
      "description": "일시적인 서비스 불가."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/OrderApiError"
          "examples":
            "service_unavailable":
              "value":
                "code": "service_unavailable"
                "detail": "서비스를 일시적으로 사용할 수 없습니다."
                "cart": null
  "examples":
    "OrderCart":
      "summary": "상품 두 종류가 담긴 장바구니"
      "value":
        "session_id": "session-1"
        "version": 2
        "currency": "KRW"
        "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3500,"line_amount":7000},{"item_id":"item-2","product_id":"sandwich","name":"에그 샌드위치","temperature":null,"quantity":1,"unit_price":5500,"line_amount":5500}]
        "total_quantity": 3
        "total_amount": 12500
        "updated_at": "2026-10-07T05:01:00Z"
    "OrderEmptyCart":
      "summary": "초기 빈 장바구니"
      "value":
        "session_id": "session-1"
        "version": 0
        "currency": "KRW"
        "items": []
        "total_quantity": 0
        "total_amount": 0
        "updated_at": "2026-10-07T05:00:00Z"
    "SimulatedOrder":
      "summary": "실제 결제가 없는 모의 주문"
      "value":
        "order_id": "order-1"
        "order_number": "A001"
        "session_id": "session-1"
        "status": "simulated"
        "currency": "KRW"
        "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3500,"line_amount":7000},{"item_id":"item-2","product_id":"sandwich","name":"에그 샌드위치","temperature":null,"quantity":1,"unit_price":5500,"line_amount":5500}]
        "total_quantity": 3
        "total_amount": 12500
        "created_at": "2026-10-07T05:02:00Z"
    "OrderCartAfterAdd":
      "summary": "버전 0에 아메리카노 2개 추가 후 버전 1"
      "value":
        "session_id": "session-1"
        "version": 1
        "currency": "KRW"
        "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3500,"line_amount":7000}]
        "total_quantity": 2
        "total_amount": 7000
        "updated_at": "2026-10-07T05:01:00Z"
    "OrderCartAfterQuantityUpdate":
      "summary": "버전 2에서 아메리카노 수량을 3개로 변경 후 버전 3"
      "value":
        "session_id": "session-1"
        "version": 3
        "currency": "KRW"
        "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":3,"unit_price":3500,"line_amount":10500},{"item_id":"item-2","product_id":"sandwich","name":"에그 샌드위치","temperature":null,"quantity":1,"unit_price":5500,"line_amount":5500}]
        "total_quantity": 4
        "total_amount": 16000
        "updated_at": "2026-10-07T05:01:00Z"
    "OrderCartAfterDelete":
      "summary": "버전 2에서 item-2 삭제 후 버전 3"
      "value":
        "session_id": "session-1"
        "version": 3
        "currency": "KRW"
        "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3500,"line_amount":7000}]
        "total_quantity": 2
        "total_amount": 7000
        "updated_at": "2026-10-07T05:01:00Z"
  schemas:
    "OrderCurrency":
      "type": "string"
      "const": "KRW"
      "description": "통화. 금액은 원 단위 정수입니다."
    "OrderQuantity":
      "type": "integer"
      "minimum": 1
      "maximum": 20
      "description": "첫 시연의 항목별 수량은 1~20개입니다. 0은 삭제로 해석하지 않습니다."
    "OrderTemperature":
      "type": ["string","null"]
      "enum": ["iced","hot",null]
      "description": "허용 온도 또는 null. 온도 선택이 없는 상품은 생략 대신 null을 사용합니다."
    "Product":
      "type": "object"
      "required": ["product_id","name","category","description","unit_price","available","temperatures"]
      "properties":
        "product_id":
          "type": "string"
          "minLength": 1
        "name":
          "type": "string"
          "minLength": 1
        "category":
          "type": "string"
          "enum": ["coffee","drink","food"]
        "description":
          "type": "string"
          "description": "설명이 없으면 빈 문자열."
        "unit_price":
          "type": "integer"
          "minimum": 0
        "available":
          "type": "boolean"
        "temperatures":
          "type": "array"
          "uniqueItems": true
          "items":
            "type": "string"
            "enum": ["iced","hot"]
          "description": "선택 가능한 온도 목록. 온도 선택이 없으면 빈 배열."
    "ProductList":
      "type": "object"
      "required": ["currency","products"]
      "properties":
        "currency":
          "$ref": "#/components/schemas/OrderCurrency"
        "products":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Product"
    "CartItem":
      "type": "object"
      "required": ["item_id","product_id","name","temperature","quantity","unit_price","line_amount"]
      "properties":
        "item_id":
          "type": "string"
          "minLength": 1
        "product_id":
          "type": "string"
          "minLength": 1
        "name":
          "type": "string"
          "minLength": 1
        "temperature":
          "$ref": "#/components/schemas/OrderTemperature"
        "quantity":
          "$ref": "#/components/schemas/OrderQuantity"
        "unit_price":
          "type": "integer"
          "minimum": 0
        "line_amount":
          "type": "integer"
          "minimum": 0
          "description": "unit_price × quantity, 원 단위."
    "Cart":
      "type": "object"
      "description": "서버가 관리하는 세션별 장바구니. 빈 장바구니는 items=[], total_quantity=0, total_amount=0."
      "required": ["session_id","version","currency","items","total_quantity","total_amount","updated_at"]
      "properties":
        "session_id":
          "type": "string"
          "minLength": 1
        "version":
          "type": "integer"
          "minimum": 0
          "description": "초기 버전 0. 변경 성공마다 증가."
        "currency":
          "$ref": "#/components/schemas/OrderCurrency"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CartItem"
        "total_quantity":
          "type": "integer"
          "minimum": 0
          "description": "모든 항목의 quantity 합."
        "total_amount":
          "type": "integer"
          "minimum": 0
          "description": "모든 항목의 line_amount 합, 원 단위."
        "updated_at":
          "type": "string"
          "format": "date-time"
    "CartItemCreateRequest":
      "type": "object"
      "description": "같은 상품·온도가 있으면 수량 합산. 합산 한도 초과 시 변경 전체를 거절합니다."
      "required": ["product_id","temperature","quantity","expected_version"]
      "properties":
        "product_id":
          "type": "string"
          "minLength": 1
        "temperature":
          "$ref": "#/components/schemas/OrderTemperature"
        "quantity":
          "$ref": "#/components/schemas/OrderQuantity"
        "expected_version":
          "type": "integer"
          "minimum": 0
    "CartItemQuantityUpdateRequest":
      "type": "object"
      "description": "quantity는 증가량이 아닌 변경 후 절대 수량입니다."
      "required": ["quantity","expected_version"]
      "properties":
        "quantity":
          "$ref": "#/components/schemas/OrderQuantity"
        "expected_version":
          "type": "integer"
          "minimum": 0
    "OrderCreateRequest":
      "type": "object"
      "description": "상품·가격은 전달하지 않고 서버 장바구니를 기준으로 확정합니다."
      "required": ["expected_version"]
      "properties":
        "expected_version":
          "type": "integer"
          "minimum": 0
    "Order":
      "type": "object"
      "description": "확정 시점의 상품·가격·수량 스냅샷. 저장·번호 발급은 백엔드 담당 범위입니다. 프론트는 order_number의 형식을 해석하거나 번호를 생성하지 않고 그대로 표시합니다. 번호의 형식·유일성 범위·보관 정책은 미정입니다."
      "required": ["order_id","order_number","session_id","status","currency","items","total_quantity","total_amount","created_at"]
      "properties":
        "order_id":
          "type": "string"
          "minLength": 1
        "order_number":
          "type": "string"
          "minLength": 1
        "session_id":
          "type": "string"
          "minLength": 1
        "status":
          "type": "string"
          "const": "simulated"
          "description": "모의 주문. 실제 결제 승인 상태가 아닙니다."
        "currency":
          "$ref": "#/components/schemas/OrderCurrency"
        "items":
          "type": "array"
          "minItems": 1
          "items":
            "$ref": "#/components/schemas/CartItem"
        "total_quantity":
          "type": "integer"
          "minimum": 1
        "total_amount":
          "type": "integer"
          "minimum": 0
        "created_at":
          "type": "string"
          "format": "date-time"
    "OrderApiError":
      "type": "object"
      "description": "신규 상품·장바구니·주문 API 전용 오류. 기존 API의 ErrorResponse는 유지합니다."
      "required": ["code","detail","cart"]
      "properties":
        "code":
          "type": "string"
          "enum": ["session_not_found","product_not_found","cart_item_not_found","session_expired","cart_version_conflict","product_unavailable","price_changed","quantity_limit_exceeded","empty_cart","idempotency_key_reused","invalid_request","invalid_option","service_unavailable"]
        "detail":
          "type": "string"
        "cart":
          "oneOf": [{"$ref":"#/components/schemas/Cart"},{"type":"null"}]
          "description": "cart_version_conflict, quantity_limit_exceeded(담긴 수량과 합쳐 한도를 넘은 경우), empty_cart에는 최신 장바구니. price_changed는 OrderConflict에 적은 후속 제안입니다. 그 밖의 오류(요청 한 건의 수량이 한도를 넘는 422 invalid_request 포함)에는 null."
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: backend }

    ConnectivityResponse:
      type: object
      required: [backend, ai_engine]
      properties:
        backend: { type: string, const: ok }
        ai_engine: { type: string, enum: [ok, unreachable] }

    SessionCreateResponse:
      type: object
      required: [session_id, started_at]
      properties:
        session_id: { type: string }
        started_at: { type: string, format: date-time }

    TouchFeatures:
      type: object
      description: 한 구간 동안의 터치 통계 (frontend가 계산)
      required: [tap_count, miss_tap_count, repeat_tap_count, back_count, dwell_ms]
      properties:
        tap_count: { type: integer, minimum: 0, description: 전체 터치 횟수 }
        miss_tap_count: { type: integer, minimum: 0, description: 버튼 밖 터치 횟수 }
        repeat_tap_count: { type: integer, minimum: 0, description: 같은 위치 반복 터치 횟수 }
        back_count: { type: integer, minimum: 0, description: 뒤로가기 횟수 }
        dwell_ms: { type: integer, minimum: 0, description: 현재 화면 체류 시간(ms) }
        scene_signals:
          $ref: "#/components/schemas/TouchSceneSignals"
          description: |
            선택 필드인 시험 블록입니다. 주문 화면은 VITE_TOUCH_INTERACTION_DRAFT를 켰을 때만 보냅니다.
            backend는 시연 스위치 DECISION_SEND_SUPPORT를 켰을 때만 읽고, 꺼져 있으면 받기만 합니다. 형식이 맞지 않아도 요청을 거절하지 않고 읽지 않으며, ai-engine으로는 보내지 않습니다.

    VisionFeatures:
      type: object
      description: 한 구간 동안의 비전 특징. 세부 항목은 Vision AI와 확정 예정
      required: [face_detected, confidence]
      properties:
        face_detected: { type: boolean }
        face_size_ratio: { type: [number, "null"], minimum: 0, maximum: 1, description: 화면 대비 얼굴 크기 }
        assistive_device: { type: [boolean, "null"], description: 휠체어·지팡이 등 검출 여부 }
        confidence: { type: number, minimum: 0, maximum: 1, description: 측정 신뢰도 }

    FeatureWindowRequest:
      type: object
      required: [screen_id, window_start, window_end, touch]
      properties:
        screen_id:
          type: string
          description: |
            현재 화면 ID. 지금 주문 화면은 구간이 끝날 때의 화면(menu 또는 review)을 보냅니다.
            음성 API는 같은 메뉴 화면을 menu_list로 보냅니다. 공통 화면 ID는 아직 정하지 않았습니다.
        window_start: { type: string, format: date-time }
        window_end:
          type: string
          format: date-time
          description: window_start보다 늦어야 합니다. 같거나 이르면 422로 거절합니다.
        touch: { $ref: "#/components/schemas/TouchFeatures" }
        vision:
          description: 카메라 측정이 없으면 null
          oneOf:
            - $ref: "#/components/schemas/VisionFeatures"
            - type: "null"

    TouchSceneSignals:
      type: object
      description: |
        한 구간의 장면 신호입니다(시험 블록). 두 횟수는 4-1과 2-1의 규칙표 입력이 되고, can_offer는 1-1과 1-2의 입력이 됩니다.
        backend는 같은 세션에서 끝 시각이 최근 touch_span_s(5초, 파일럿 값) 안에 드는 구간들의 횟수를 더합니다. 구간 단위로 셉니다.
        그 구간 가운데 하나라도 블록이 없거나 값이 null이면 합은 모름입니다. schema_version이 다르거나 형식이 맞지 않는 블록은 읽지 않습니다.
      required: [schema_version, near_miss_fix_count, zoom_attempt_count, can_offer]
      properties:
        schema_version: { type: string, enum: [touch-scene-signals-pilot-v1] }
        near_miss_fix_count:
          type: [integer, "null"]
          minimum: 0
          description: |
            이 구간에서 바로 앞 누름의 빗나감을 고친 누름 수입니다(4-1). 빗나감은 대상이 없는 누름이고, 같은 세션의 다음 누름이 그 빗나감의 가장 가까운 후보 가운데 하나를 누르면 바로 고친 것으로 봅니다.
            시간과 거리의 한계는 두지 않습니다(ai-engine 비전 모듈 touch.py의 정의를 팀에 제안한 것). 대상 정보가 없는 누름이 구간에 있으면 null입니다.
            backend는 그 합을 fixes_recent로 씁니다.
        zoom_attempt_count:
          type: [integer, "null"]
          minimum: 0
          description: |
            이 구간의 확대 시도 수입니다(2-1). 대상이 없는 누름 두 번이 이어지고, 두 번째 누름이 주문 화면의 기존 두 번 누름 간격과 같은 자리 거리 안에 들면 한 번으로 셉니다(글자 두 번 누르기).
            두 손가락 벌리기는 세지 않습니다. 셀 수 없는 구간은 null입니다. backend는 합이 1 이상이면 zoom_attempt를 true로 봅니다.
        can_offer:
          type: [boolean, "null"]
          description: |
            주문 화면이 이 구간을 만든 때 묻기(안내 바의 제안 카드)를 띄울 수 있었는지입니다. 화면 자신의 조건(옵션·화면 도움·장바구니·처음으로 창과 크게 보기 미리보기
            카드가 닫혀 있고, 말로 주문이 꺼져 있고, 안내 메시지가 없고, 주문을 바꿀 수 있음)을 그대로 씁니다. 알 수 없으면 null입니다.
            backend는 false인 구간에서 1-1 말로 주문과 1-2 화면 내리기 묻기를 열지 않습니다. 다른 행은 읽지 않습니다.
      example: { schema_version: touch-scene-signals-pilot-v1, near_miss_fix_count: 1, zoom_attempt_count: 0, can_offer: true }

    StateScores:
      type: object
      description: 5가지 불편 상태 점수(0~1). 여러 상태가 동시에 높을 수 있음
      required: [normal, touch_difficulty, navigation_difficulty, visual_difficulty, hesitation]
      properties:
        normal: { type: number, minimum: 0, maximum: 1, description: 정상 사용 }
        touch_difficulty: { type: number, minimum: 0, maximum: 1, description: 터치 조작 불편 }
        navigation_difficulty: { type: number, minimum: 0, maximum: 1, description: 메뉴 탐색 불편 }
        visual_difficulty: { type: number, minimum: 0, maximum: 1, description: 시각적 불편 }
        hesitation: { type: number, minimum: 0, maximum: 1, description: 망설임·혼란 }

    UIPreset:
      type: string
      enum: [none, large_text, large_button, simple_screen, step_guide, voice_guide]
      description: |
        none=현재 화면 유지, 큰 글씨, 큰 버튼, 간편 화면, 단계별 안내, 음성 안내.
        프론트의 수동 낮은 화면(lowScreen)은 로컬 설정이며 이 프리셋이나 API 요청 필드에 포함하지 않습니다.
        none은 사용자가 켠 낮은 화면을 해제하지 않습니다.
        음성·AI·MCP에서 낮은 화면을 적용하는 프리셋 값과 적용·복귀 규칙은 팀 합의 후 별도 반영합니다.

    SupportDecision:
      type: object
      description: |
        기본 응답은 preset none, requires_confirmation false, decided_by rule_placeholder입니다.
        backend의 시연 스위치 DECISION_SEND_SUPPORT를 켜면 판단 층 규칙표의 결정을 싣습니다.
        preset·requires_confirmation은 그 결정의 계약 형식이고, 지원이 화면에 떠 있는 동안 아래 선택 필드 5개가 더해집니다.
        선택 필드는 값이 없으면 응답에서 빠집니다.
      required: [preset, requires_confirmation, decided_by]
      properties:
        preset: { $ref: "#/components/schemas/UIPreset" }
        requires_confirmation:
          type: boolean
          description: |
            true면 사용자 확인 후 적용합니다. 지금 주문 화면은 안내 바의 프리셋을 이 값과 관계없이 먼저 묻고,
            시연 스위치 응답 가운데 화면이 묻지 않고 실행하는 결정(강조, 남은 단계 안내, 기다림)은 묻지 않습니다.
        decided_by: { type: string, enum: [rule_placeholder, jev], description: "Jev 답을 화면 결정에 쓰기 전(그림자 단계)에는 rule_placeholder입니다. 지금 backend는 Jev를 그림자 단계로만 부르므로 시연 스위치를 켜도 rule_placeholder입니다." }
        name:
          type: string
          description: |
            규칙표의 지원 이름(backend/app/modules/decision/rule_table.py). 시연 스위치를 켰을 때만 옵니다.
            wait_hold_timer(3-2 기다림), remaining_steps_notice·delay_responsibility_notice(3-1 안내),
            large_button(4-1 크게 보기 묻기), highlight_next_action(4-2 다음 동작 강조),
            lower_screen(1-2 화면 내리기 묻기), voice_order(1-1 말로 주문하기 묻기), continue_or_new_order(2-2 처음부터 주문할지 묻기),
            large_text(2-1 크게 보기 묻기), highlight_large_view_help(2-1 화면 도움 입구 강조)
            크게 보기는 글자와 버튼을 함께 키우는 지원 하나입니다. large_text와 large_button은 그 지원을 묻는 두 행(2-1, 4-1)의 이름이고, preset도 각각 그 값입니다.
            lower_screen·voice_order·continue_or_new_order에 맞는 프리셋은 없어서, 이 셋은 preset none, requires_confirmation true와 이 이름으로 묻습니다.
          examples: [highlight_next_action, lower_screen]
        decision_id:
          type: string
          description: |
            규칙표 결정의 ID. 같은 결정이 유지되는 동안에는 매 응답에 같은 값이 오고, 새로 열거나 바꾼 결정에는 새 값이 옵니다.
            시연 스위치를 켰을 때만 옵니다.
          examples: [d0001]
        steps_left: { type: integer, minimum: 0, description: 주문이 끝나기 전까지 남은 화면 수, examples: [2] }
        target_id:
          type: string
          description: 지원이 가리키는 대상. cart-add(옵션 창의 담기 버튼), "cart:*:decrease"(장바구니 줄의 빼기 버튼), cart_progress(안내의 진행 줄), support-toggle(화면 도움 입구)
          examples: ["cart:*:decrease"]
        message_id:
          type: string
          description: 안내 문구 ID. steps_left_notice, delay_responsibility_notice
          examples: [steps_left_notice]

    FeatureWindowResponse:
      type: object
      required: [session_id, ai_available, support]
      properties:
        session_id: { type: string }
        ai_available:
          type: boolean
          description: |
            ai-engine 호출이나 응답 검증에 실패하면 false입니다.
            유효한 응답의 measurable이 false이면 ai_available은 true이고 states는 null입니다.
        states:
          oneOf:
            - $ref: "#/components/schemas/StateScores"
            - type: "null"
        model_version: { type: [string, "null"] }
        support: { $ref: "#/components/schemas/SupportDecision" }

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
