openapi: 3.1.0
info:
  title: Frontend ↔ Backend API
  version: 0.3.0
  x-order-api-status: draft
  description: |
    React 키오스크(frontend)와 FastAPI backend 사이의 API 명세입니다.
    frontend는 backend와만 통신합니다. (AGENTS.md 4장)
    0.1.0의 상태·연결·세션·특징 API 형식을 유지하고 상품·서버 장바구니·모의 주문 API를 추가합니다.
    신규 주문 API는 팀 검토용 초안이며 각 operation의 x-contract-status=draft로 구분합니다.
    2026-10-10 프론트의 타입·호출 함수·응답 표시·재시도 코드를 이 초안에 맞춰 준비했습니다.
    x-frontend-status=prepared는 프론트 준비 상태이며 실제 API 연동 완료나 팀 합의가 아닙니다.
    최신 원격 main ff79f1a에는 기존 상태·연결 확인·임시 세션·특징 전송이 구현돼 있습니다.
    상품·장바구니·주문 서버 API는 구현 대기이며 x-backend-status=pending으로 구분합니다.
    기존 세션 생성 API를 사용하고 프론트에서 별도 서버 세션·장바구니 저장소를 만들지 않습니다.
    성공 응답 후 서버 수량·금액을 표시합니다. 새로고침·새 주문은 새 세션을 요청하는 프론트 방향입니다.
    첫 시연은 고정 상품·가격을 제안하며 복원·장기 보관·정밀 만료·동적 가격 변경은 후순위입니다.
    수량 한도 20, 완료 세션 제어, 세션 접근·인증, 멱등성 키 보관·처리 중·실패 정책,
    주문번호·서버 저장 방식은 백엔드 담당자와 팀이 합의합니다. 특정 쿠키나 환경변수를 새로 확정하지 않습니다.
    이번 변경은 계약 문서이며 백엔드 실행 코드는 수정하지 않습니다. 실제 결제·음성·MCP·SSE 연동은 제외합니다.
servers:
  - url: http://localhost:8000
    description: docker compose 로컬 실행

paths:
  /health:
    get:
      summary: backend 프로세스 상태 확인
      operationId: getBackendHealth
      x-frontend-status: client-only
      x-backend-status: implemented
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example: { status: ok, service: backend }

  /api/v1/connectivity:
    get:
      summary: backend → ai-server 연결 확인 (Docker 네트워크 확인용)
      operationId: getConnectivity
      x-frontend-status: client-only
      x-backend-status: implemented
      responses:
        "200":
          description: 확인 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectivityResponse"
              example: { backend: ok, ai_server: ok }

  /api/v1/sessions:
    post:
      summary: 키오스크 이용 세션 시작
      operationId: createSession
      x-frontend-status: prepared
      x-backend-status: implemented
      description: |
        요청 본문 없이 기존 session_id·started_at 응답을 사용합니다.
        최신 원격 main의 modules/sessions/ 구현을 기준으로 장바구니·주문 연결을 검토합니다.
        프론트는 첫 시연의 새로고침·새 주문 시작에 새 세션을 요청합니다.
        한 세션의 완료 제어·만료·복원·접근 및 인증 정책은 팀 합의가 필요합니다.
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreateResponse"
              example:
                session_id: 3f2c9a0e7b1d4c5e8f6a2b1c0d9e8f7a
                started_at: "2026-10-01T10:00:00Z"

  /api/v1/sessions/{session_id}/features:
    post:
      summary: 시간 구간 특징 전송 → 불편 상태와 지원 방식 응답
      description: |
        frontend가 1~3초 구간마다 터치 통계와 비전 특징을 보냅니다.
        backend는 ai-server 결과를 검증해 반환합니다.
        최신 원격 main의 연결 검증 구현은 support.preset=none, requires_confirmation=false로 화면을 유지합니다.
        자동 지원 결정은 미구현이며 주문 화면에서는 이 API를 호출하지 않습니다.
        ai-server 호출이 실패하면 ai_available=false, states=null, model_version=null로 응답합니다.
      operationId: sendFeatureWindow
      x-frontend-status: client-only
      x-backend-status: implemented
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureWindowRequest"
            example:
              screen_id: menu_list
              window_start: "2026-10-01T10:00:00Z"
              window_end: "2026-10-01T10:00:03Z"
              touch: { tap_count: 6, miss_tap_count: 3, repeat_tap_count: 2, back_count: 0, dwell_ms: 3000 }
              vision: { face_detected: true, face_size_ratio: 0.35, assistive_device: false, confidence: 0.9 }
      responses:
        "200":
          description: 판단 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureWindowResponse"
              example:
                session_id: 3f2c9a0e7b1d4c5e8f6a2b1c0d9e8f7a
                ai_available: true
                states: { normal: 0.167, touch_difficulty: 0.833, navigation_difficulty: 0, visual_difficulty: 0.056, hesitation: 0.1 }
                model_version: dummy-0.1
                support: { preset: none, requires_confirmation: false, decided_by: rule_placeholder }
        "404":
          description: 없는 세션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { detail: session not found }
        "422":
          description: 요청 형식 오류

  "/api/v1/products":
    "get":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "pending"
      "tags": ["products"]
      "summary": "상품 목록 조회"
      "operationId": "getProducts"
      "description": "상품 전체를 조회하고 coffee/drink/food를 화면 분류 값으로 표시합니다. 기본 시연은 고정 상품·가격을 제안하되 데이터는 백엔드 담당자가 제공합니다. 프론트는 API의 가격·온도·판매 가능 여부를 사용합니다. 페이지네이션·검색·이미지 API는 포함하지 않습니다."
      "responses":
        "200":
          "description": "상품 목록."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ProductList"
              "example":
                "currency": "KRW"
                "products": [{"product_id":"americano","name":"아메리카노","category":"coffee","description":"깊고 깔끔한 에스프레소","unit_price":3500,"available":true,"temperatures":["iced","hot"]},{"product_id":"sandwich","name":"에그 샌드위치","category":"food","description":"든든한 달걀 샌드위치","unit_price":5500,"available":true,"temperatures":[]}]
        "503":
          "$ref": "#/components/responses/OrderUnavailable"
  "/api/v1/sessions/{session_id}/cart":
    "parameters": [{"$ref":"#/components/parameters/OrderSessionId"}]
    "get":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "pending"
      "tags": ["cart"]
      "summary": "세션 장바구니 조회"
      "operationId": "getCart"
      "description": "현재 이용의 서버 장바구니를 조회합니다. 첫 시연용 프론트는 새로고침·새 주문 시작에 새 세션을 요청하고 해당 세션의 Cart를 조회합니다. 접근성 설정만 로컬에 유지하며 로컬 Cart로 서버를 덮어쓰지 않습니다. 이전 이용·완료 화면 복원은 후순위입니다."
      "responses":
        "200":
          "description": "조회 또는 변경 후 전체 서버 장바구니."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
              "examples":
                "cart":
                  "$ref": "#/components/examples/OrderCart"
                "empty":
                  "$ref": "#/components/examples/OrderEmptyCart"
        "404":
          "$ref": "#/components/responses/OrderNotFound"
        "410":
          "$ref": "#/components/responses/OrderSessionExpired"
        "422":
          "$ref": "#/components/responses/OrderInvalidRequest"
        "503":
          "$ref": "#/components/responses/OrderUnavailable"
  "/api/v1/sessions/{session_id}/cart/items":
    "parameters": [{"$ref":"#/components/parameters/OrderSessionId"}]
    "post":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "pending"
      "tags": ["cart"]
      "summary": "상품 추가 또는 동일 상품·온도 수량 합산"
      "operationId": "addCartItem"
      "description": "백엔드가 상품·옵션·판매 가능 여부·수량을 검증하고 같은 상품·온도는 합산하는 제안입니다. 합산 20개 초과 시 409 quantity_limit_exceeded로 변경 전체 거절을 제안하며 최종 한도·방식은 팀 검토 대상입니다. 허용되지 않은 옵션은 422 invalid_option, 필수 필드 누락·타입 오류는 422 invalid_request입니다. 서버 버전 확인·변경·결과 및 멱등성 기록의 원자적 처리는 백엔드 구현 범위입니다. 프론트는 성공 응답 후 전체 Cart를 표시합니다."
      "parameters": [{"$ref":"#/components/parameters/OrderIdempotencyKey"}]
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CartItemCreateRequest"
            "example":
              "product_id": "americano"
              "temperature": "iced"
              "quantity": 2
              "expected_version": 0
      "responses":
        "200":
          "description": "변경 후 전체 서버 장바구니."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
              "examples":
                "cart":
                  "$ref": "#/components/examples/OrderCartAfterAdd"
        "404":
          "$ref": "#/components/responses/OrderNotFound"
        "409":
          "$ref": "#/components/responses/OrderConflict"
        "410":
          "$ref": "#/components/responses/OrderSessionExpired"
        "422":
          "$ref": "#/components/responses/OrderInvalidRequest"
        "503":
          "$ref": "#/components/responses/OrderUnavailable"
  "/api/v1/sessions/{session_id}/cart/items/{item_id}":
    "parameters": [{"$ref":"#/components/parameters/OrderSessionId"},{"$ref":"#/components/parameters/OrderCartItemId"}]
    "patch":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "pending"
      "tags": ["cart"]
      "summary": "장바구니 항목의 절대 수량 변경"
      "operationId": "updateCartItemQuantity"
      "description": "quantity는 변경 후 수량입니다. 0은 삭제로 처리하지 않습니다. 가격·판매 가능 여부를 검증하고 현재 적용 단가를 반환합니다. 버전 확인·변경·성공 응답 및 멱등성 키 저장은 원자적으로 처리합니다."
      "parameters": [{"$ref":"#/components/parameters/OrderIdempotencyKey"}]
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CartItemQuantityUpdateRequest"
            "example":
              "quantity": 3
              "expected_version": 2
      "responses":
        "200":
          "description": "변경 후 전체 서버 장바구니."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
              "examples":
                "cart":
                  "$ref": "#/components/examples/OrderCartAfterQuantityUpdate"
        "404":
          "$ref": "#/components/responses/OrderNotFound"
        "409":
          "$ref": "#/components/responses/OrderConflict"
        "410":
          "$ref": "#/components/responses/OrderSessionExpired"
        "422":
          "$ref": "#/components/responses/OrderInvalidRequest"
        "503":
          "$ref": "#/components/responses/OrderUnavailable"
    "delete":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "pending"
      "tags": ["cart"]
      "summary": "장바구니 항목 삭제"
      "operationId": "deleteCartItem"
      "description": "본문 없이 expected_version 쿼리로 버전을 전달합니다. 삭제 후 전체 장바구니를 반환합니다. 버전 확인·변경·성공 응답 및 멱등성 키 저장은 원자적으로 처리합니다. 예시 요청은 item-2?expected_version=2 삭제이며, 응답은 아메리카노 항목만 남은 버전 3입니다."
      "parameters": [{"$ref":"#/components/parameters/OrderIdempotencyKey"},{"$ref":"#/components/parameters/OrderExpectedVersion"}]
      "responses":
        "200":
          "description": "변경 후 전체 서버 장바구니."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
              "examples":
                "cart":
                  "$ref": "#/components/examples/OrderCartAfterDelete"
        "404":
          "$ref": "#/components/responses/OrderNotFound"
        "409":
          "$ref": "#/components/responses/OrderConflict"
        "410":
          "$ref": "#/components/responses/OrderSessionExpired"
        "422":
          "$ref": "#/components/responses/OrderInvalidRequest"
        "503":
          "$ref": "#/components/responses/OrderUnavailable"
  "/api/v1/sessions/{session_id}/orders":
    "parameters": [{"$ref":"#/components/parameters/OrderSessionId"}]
    "post":
      "x-contract-status": "draft"
      "x-frontend-status": "prepared"
      "x-backend-status": "pending"
      "tags": ["orders"]
      "summary": "서버 장바구니를 모의 주문으로 확정"
      "operationId": "createSimulatedOrder"
      "description": "상품·가격을 요청에 다시 넣지 않고 서버 Cart를 기준으로 확정합니다. 서버의 상품·옵션·판매 가능 여부·버전 검증, 주문 스냅샷 저장·번호 발급·Cart 비우기·버전 증가·중복 방지 기록은 백엔드 구현 범위입니다. 프론트는 성공 응답의 주문번호를 그대로 표시하며 성공 전에 Cart를 비우지 않습니다. 한 세션 1주문·새 주문 새 세션은 사용자 검토 방향이며 서버의 완료 제어는 팀 합의 대기입니다. 첫 시연은 고정 가격을 제안하고, 동적 가격 변경 시 전체 Cart 가격·금액 갱신·버전 증가·재확인은 후순위 검토 방향입니다. 실제 결제·재고 차감·완료 화면 복원은 이번 구현 범위에서 제외합니다."
      "parameters": [{"$ref":"#/components/parameters/OrderIdempotencyKey"}]
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/OrderCreateRequest"
            "example":
              "expected_version": 2
      "responses":
        "201":
          "description": "모의 주문 생성. 성공한 동일 요청의 재시도에도 동일 상태 코드와 원래 응답을 반환합니다."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
              "examples":
                "order":
                  "$ref": "#/components/examples/SimulatedOrder"
        "404":
          "$ref": "#/components/responses/OrderNotFound"
        "409":
          "$ref": "#/components/responses/OrderConflict"
        "410":
          "$ref": "#/components/responses/OrderSessionExpired"
        "422":
          "$ref": "#/components/responses/OrderInvalidRequest"
        "503":
          "$ref": "#/components/responses/OrderUnavailable"

components:
  "parameters":
    "OrderSessionId":
      "name": "session_id"
      "in": "path"
      "required": true
      "description": "기존 POST /api/v1/sessions가 반환하는 서버 세션 ID. 최신 원격 main의 임시 세션을 Cart·Order에도 사용할 것을 제안합니다. 만료·접근·인증·보관 정책은 미정입니다."
      "schema":
        "type": "string"
        "minLength": 1
    "OrderCartItemId":
      "name": "item_id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "minLength": 1
    "OrderExpectedVersion":
      "name": "expected_version"
      "in": "query"
      "required": true
      "description": "DELETE 요청의 마지막으로 조회한 장바구니 버전."
      "schema":
        "type": "integer"
        "minimum": 0
    "OrderIdempotencyKey":
      "name": "Idempotency-Key"
      "in": "header"
      "required": true
      "description": "프론트는 사용자 동작마다 UUID를 생성합니다. 응답 유실의 수동 재시도에는 같은 키·경로·메서드·쿼리·버전·본문을 유지합니다. 성공한 동일 요청의 원래 응답 재생과 다른 요청에 같은 키를 재사용할 때의 409를 제안합니다. 버전 충돌 후 사용자가 최신 Cart로 재조작하면 새 키를 사용합니다. 세션 접근 검증과 결과 기록·재생은 백엔드 책임이며 보관 기간·처리 중 오류 코드·실패 응답 재사용 정책은 팀 합의가 필요합니다. 세션 생성에는 이 헤더를 새로 요구하지 않습니다."
      "schema":
        "type": "string"
        "format": "uuid"
  "responses":
    "OrderNotFound":
      "description": "세션·상품·장바구니 항목 없음. 해당 요청에 해당하는 코드만 반환합니다."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/OrderApiError"
          "examples":
            "session_not_found":
              "value":
                "code": "session_not_found"
                "detail": "세션을 찾을 수 없습니다."
                "cart": null
            "product_not_found":
              "value":
                "code": "product_not_found"
                "detail": "상품을 찾을 수 없습니다."
                "cart": null
            "cart_item_not_found":
              "value":
                "code": "cart_item_not_found"
                "detail": "장바구니 항목을 찾을 수 없습니다."
                "cart": null
    "OrderSessionExpired":
      "description": "세션 만료의 예약 응답입니다. 정확한 만료 시간·안내·복구는 후순위 검토 대상이며 현재 main의 시간 만료 구현을 뜻하지 않습니다."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/OrderApiError"
          "examples":
            "session_expired":
              "value":
                "code": "session_expired"
                "detail": "이용 세션이 만료되었습니다."
                "cart": null
    "OrderConflict":
      "description": "상태 충돌 응답의 제안입니다. 버전 충돌은 최신 Cart를 표시하고 사용자 재조작을 기다립니다. 주문 실패 시 주문 생성·Cart 비우기를 하지 않는 방향입니다. price_changed는 후순위 동적 가격 변경 예시입니다. 처리 중 중복에 409와 Retry-After를 제공하는 방향은 검토 중이며 구체적인 오류 코드는 합의 후 추가합니다."
      "headers":
        "Retry-After":
          "description": "처리 중 중복 요청에 선택적으로 지원할 재시도 대기 시간(초) 제안. 프론트는 값이 있으면 새 변경을 막고 같은 요청으로 수동 재시도합니다. 서버 지원·오류 코드·대기 시간은 미정입니다."
          "schema":
            "type": "integer"
            "minimum": 0
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/OrderApiError"
          "examples":
            "cart_version_conflict":
              "value":
                "code": "cart_version_conflict"
                "detail": "장바구니가 변경되었습니다. 최신 내용을 확인해 주세요."
                "cart":
                  "session_id": "session-1"
                  "version": 2
                  "currency": "KRW"
                  "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3500,"line_amount":7000},{"item_id":"item-2","product_id":"sandwich","name":"에그 샌드위치","temperature":null,"quantity":1,"unit_price":5500,"line_amount":5500}]
                  "total_quantity": 3
                  "total_amount": 12500
                  "updated_at": "2026-10-07T05:01:00Z"
            "price_changed":
              "value":
                "code": "price_changed"
                "detail": "상품 가격이 변경되었습니다. 최신 금액을 확인해 주세요."
                "cart":
                  "session_id": "session-1"
                  "version": 3
                  "currency": "KRW"
                  "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3800,"line_amount":7600},{"item_id":"item-2","product_id":"sandwich","name":"에그 샌드위치","temperature":null,"quantity":1,"unit_price":5500,"line_amount":5500}]
                  "total_quantity": 3
                  "total_amount": 13100
                  "updated_at": "2026-10-07T05:01:00Z"
            "product_unavailable":
              "value":
                "code": "product_unavailable"
                "detail": "현재 주문할 수 없는 상품입니다."
                "cart": null
            "quantity_limit_exceeded":
              "value":
                "code": "quantity_limit_exceeded"
                "detail": "장바구니 항목의 수량 한도를 초과했습니다."
                "cart": null
            "empty_cart":
              "value":
                "code": "empty_cart"
                "detail": "빈 장바구니로 주문할 수 없습니다."
                "cart": null
            "idempotency_key_reused":
              "value":
                "code": "idempotency_key_reused"
                "detail": "같은 중복 방지 키에 다른 요청을 사용할 수 없습니다."
                "cart": null
    "OrderInvalidRequest":
      "description": "필수 필드·헤더·타입·수량 오류 또는 허용되지 않은 옵션. 신규 API의 검증 오류도 이 형식을 사용합니다."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/OrderApiError"
          "examples":
            "invalid_request":
              "value":
                "code": "invalid_request"
                "detail": "요청 형식이 올바르지 않습니다."
                "cart": null
            "invalid_option":
              "value":
                "code": "invalid_option"
                "detail": "이 상품에서 선택할 수 없는 온도입니다."
                "cart": null
    "OrderUnavailable":
      "description": "일시적인 서비스 불가."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/OrderApiError"
          "examples":
            "service_unavailable":
              "value":
                "code": "service_unavailable"
                "detail": "서비스를 일시적으로 사용할 수 없습니다."
                "cart": null
  "examples":
    "OrderCart":
      "summary": "상품 두 종류가 담긴 장바구니"
      "value":
        "session_id": "session-1"
        "version": 2
        "currency": "KRW"
        "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3500,"line_amount":7000},{"item_id":"item-2","product_id":"sandwich","name":"에그 샌드위치","temperature":null,"quantity":1,"unit_price":5500,"line_amount":5500}]
        "total_quantity": 3
        "total_amount": 12500
        "updated_at": "2026-10-07T05:01:00Z"
    "OrderEmptyCart":
      "summary": "초기 빈 장바구니"
      "value":
        "session_id": "session-1"
        "version": 0
        "currency": "KRW"
        "items": []
        "total_quantity": 0
        "total_amount": 0
        "updated_at": "2026-10-07T05:00:00Z"
    "SimulatedOrder":
      "summary": "실제 결제가 없는 모의 주문"
      "value":
        "order_id": "order-1"
        "order_number": "A001"
        "session_id": "session-1"
        "status": "simulated"
        "currency": "KRW"
        "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3500,"line_amount":7000},{"item_id":"item-2","product_id":"sandwich","name":"에그 샌드위치","temperature":null,"quantity":1,"unit_price":5500,"line_amount":5500}]
        "total_quantity": 3
        "total_amount": 12500
        "created_at": "2026-10-07T05:02:00Z"
    "OrderCartAfterAdd":
      "summary": "버전 0에 아메리카노 2개 추가 후 버전 1"
      "value":
        "session_id": "session-1"
        "version": 1
        "currency": "KRW"
        "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3500,"line_amount":7000}]
        "total_quantity": 2
        "total_amount": 7000
        "updated_at": "2026-10-07T05:01:00Z"
    "OrderCartAfterQuantityUpdate":
      "summary": "버전 2에서 아메리카노 수량을 3개로 변경 후 버전 3"
      "value":
        "session_id": "session-1"
        "version": 3
        "currency": "KRW"
        "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":3,"unit_price":3500,"line_amount":10500},{"item_id":"item-2","product_id":"sandwich","name":"에그 샌드위치","temperature":null,"quantity":1,"unit_price":5500,"line_amount":5500}]
        "total_quantity": 4
        "total_amount": 16000
        "updated_at": "2026-10-07T05:01:00Z"
    "OrderCartAfterDelete":
      "summary": "버전 2에서 item-2 삭제 후 버전 3"
      "value":
        "session_id": "session-1"
        "version": 3
        "currency": "KRW"
        "items": [{"item_id":"item-1","product_id":"americano","name":"아메리카노","temperature":"iced","quantity":2,"unit_price":3500,"line_amount":7000}]
        "total_quantity": 2
        "total_amount": 7000
        "updated_at": "2026-10-07T05:01:00Z"
  schemas:
    "OrderCurrency":
      "type": "string"
      "const": "KRW"
      "description": "통화. 금액은 원 단위 정수입니다."
    "OrderQuantity":
      "type": "integer"
      "minimum": 1
      "maximum": 20
      "description": "항목별 수량 1~20 제안. 최종 한도는 팀 검토 항목이며 0은 삭제로 해석하지 않습니다."
    "OrderTemperature":
      "type": ["string","null"]
      "enum": ["iced","hot",null]
      "description": "허용 온도 또는 null. 온도 선택이 없는 상품은 생략 대신 null을 사용합니다."
    "Product":
      "type": "object"
      "required": ["product_id","name","category","description","unit_price","available","temperatures"]
      "properties":
        "product_id":
          "type": "string"
          "minLength": 1
        "name":
          "type": "string"
          "minLength": 1
        "category":
          "type": "string"
          "enum": ["coffee","drink","food"]
        "description":
          "type": "string"
          "description": "설명이 없으면 빈 문자열."
        "unit_price":
          "type": "integer"
          "minimum": 0
        "available":
          "type": "boolean"
        "temperatures":
          "type": "array"
          "uniqueItems": true
          "items":
            "type": "string"
            "enum": ["iced","hot"]
          "description": "선택 가능한 온도 목록. 온도 선택이 없으면 빈 배열."
    "ProductList":
      "type": "object"
      "required": ["currency","products"]
      "properties":
        "currency":
          "$ref": "#/components/schemas/OrderCurrency"
        "products":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Product"
    "CartItem":
      "type": "object"
      "required": ["item_id","product_id","name","temperature","quantity","unit_price","line_amount"]
      "properties":
        "item_id":
          "type": "string"
          "minLength": 1
        "product_id":
          "type": "string"
          "minLength": 1
        "name":
          "type": "string"
          "minLength": 1
        "temperature":
          "$ref": "#/components/schemas/OrderTemperature"
        "quantity":
          "$ref": "#/components/schemas/OrderQuantity"
        "unit_price":
          "type": "integer"
          "minimum": 0
        "line_amount":
          "type": "integer"
          "minimum": 0
          "description": "unit_price × quantity, 원 단위."
    "Cart":
      "type": "object"
      "description": "서버가 관리하는 세션별 장바구니. 빈 장바구니는 items=[], total_quantity=0, total_amount=0."
      "required": ["session_id","version","currency","items","total_quantity","total_amount","updated_at"]
      "properties":
        "session_id":
          "type": "string"
          "minLength": 1
        "version":
          "type": "integer"
          "minimum": 0
          "description": "초기 버전 0. 변경 성공마다 증가."
        "currency":
          "$ref": "#/components/schemas/OrderCurrency"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CartItem"
        "total_quantity":
          "type": "integer"
          "minimum": 0
          "description": "모든 항목의 quantity 합."
        "total_amount":
          "type": "integer"
          "minimum": 0
          "description": "모든 항목의 line_amount 합, 원 단위."
        "updated_at":
          "type": "string"
          "format": "date-time"
    "CartItemCreateRequest":
      "type": "object"
      "description": "같은 상품·온도가 있으면 수량 합산. 합산 한도 초과 시 변경 전체를 거절합니다."
      "required": ["product_id","temperature","quantity","expected_version"]
      "properties":
        "product_id":
          "type": "string"
          "minLength": 1
        "temperature":
          "$ref": "#/components/schemas/OrderTemperature"
        "quantity":
          "$ref": "#/components/schemas/OrderQuantity"
        "expected_version":
          "type": "integer"
          "minimum": 0
    "CartItemQuantityUpdateRequest":
      "type": "object"
      "description": "quantity는 증가량이 아닌 변경 후 절대 수량입니다."
      "required": ["quantity","expected_version"]
      "properties":
        "quantity":
          "$ref": "#/components/schemas/OrderQuantity"
        "expected_version":
          "type": "integer"
          "minimum": 0
    "OrderCreateRequest":
      "type": "object"
      "description": "상품·가격은 전달하지 않고 서버 장바구니를 기준으로 확정합니다."
      "required": ["expected_version"]
      "properties":
        "expected_version":
          "type": "integer"
          "minimum": 0
    "Order":
      "type": "object"
      "description": "확정 시점의 상품·가격·수량 스냅샷. 저장·번호 발급은 백엔드 담당 범위입니다. 프론트는 order_number의 형식을 해석하거나 번호를 생성하지 않고 그대로 표시합니다. 번호의 형식·유일성 범위·보관 정책은 미정입니다."
      "required": ["order_id","order_number","session_id","status","currency","items","total_quantity","total_amount","created_at"]
      "properties":
        "order_id":
          "type": "string"
          "minLength": 1
        "order_number":
          "type": "string"
          "minLength": 1
        "session_id":
          "type": "string"
          "minLength": 1
        "status":
          "type": "string"
          "const": "simulated"
          "description": "모의 주문. 실제 결제 승인 상태가 아닙니다."
        "currency":
          "$ref": "#/components/schemas/OrderCurrency"
        "items":
          "type": "array"
          "minItems": 1
          "items":
            "$ref": "#/components/schemas/CartItem"
        "total_quantity":
          "type": "integer"
          "minimum": 1
        "total_amount":
          "type": "integer"
          "minimum": 0
        "created_at":
          "type": "string"
          "format": "date-time"
    "OrderApiError":
      "type": "object"
      "description": "신규 상품·장바구니·주문 API 전용 오류. 기존 API의 ErrorResponse는 유지합니다."
      "required": ["code","detail","cart"]
      "properties":
        "code":
          "type": "string"
          "enum": ["session_not_found","product_not_found","cart_item_not_found","session_expired","cart_version_conflict","product_unavailable","price_changed","quantity_limit_exceeded","empty_cart","idempotency_key_reused","invalid_request","invalid_option","service_unavailable"]
        "detail":
          "type": "string"
        "cart":
          "oneOf": [{"$ref":"#/components/schemas/Cart"},{"type":"null"}]
          "description": "버전·가격 충돌에는 최신 장바구니. 복원할 상태가 없으면 null."
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: backend }

    ConnectivityResponse:
      type: object
      required: [backend, ai_server]
      properties:
        backend: { type: string, const: ok }
        ai_server: { type: string, enum: [ok, unreachable] }

    SessionCreateResponse:
      type: object
      required: [session_id, started_at]
      properties:
        session_id: { type: string }
        started_at: { type: string, format: date-time }

    TouchFeatures:
      type: object
      description: 한 구간 동안의 터치 통계 (frontend가 계산)
      required: [tap_count, miss_tap_count, repeat_tap_count, back_count, dwell_ms]
      properties:
        tap_count: { type: integer, minimum: 0, description: 전체 터치 횟수 }
        miss_tap_count: { type: integer, minimum: 0, description: 버튼 밖 터치 횟수 }
        repeat_tap_count: { type: integer, minimum: 0, description: 같은 위치 반복 터치 횟수 }
        back_count: { type: integer, minimum: 0, description: 뒤로가기 횟수 }
        dwell_ms: { type: integer, minimum: 0, description: 현재 화면 체류 시간(ms) }

    VisionFeatures:
      type: object
      description: 한 구간 동안의 비전 특징. 세부 항목은 Vision AI와 확정 예정
      required: [face_detected, confidence]
      properties:
        face_detected: { type: boolean }
        face_size_ratio: { type: [number, "null"], minimum: 0, maximum: 1, description: 화면 대비 얼굴 크기 }
        assistive_device: { type: [boolean, "null"], description: 휠체어·지팡이 등 검출 여부 }
        confidence: { type: number, minimum: 0, maximum: 1, description: 측정 신뢰도 }

    FeatureWindowRequest:
      type: object
      required: [screen_id, window_start, window_end, touch]
      properties:
        screen_id: { type: string, description: 현재 화면 ID }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        touch: { $ref: "#/components/schemas/TouchFeatures" }
        vision:
          description: 카메라 측정이 없으면 null
          oneOf:
            - $ref: "#/components/schemas/VisionFeatures"
            - type: "null"

    StateScores:
      type: object
      description: 5가지 불편 상태 점수(0~1). 여러 상태가 동시에 높을 수 있음
      required: [normal, touch_difficulty, navigation_difficulty, visual_difficulty, hesitation]
      properties:
        normal: { type: number, minimum: 0, maximum: 1, description: 정상 사용 }
        touch_difficulty: { type: number, minimum: 0, maximum: 1, description: 터치 조작 불편 }
        navigation_difficulty: { type: number, minimum: 0, maximum: 1, description: 메뉴 탐색 불편 }
        visual_difficulty: { type: number, minimum: 0, maximum: 1, description: 시각적 불편 }
        hesitation: { type: number, minimum: 0, maximum: 1, description: 망설임·혼란 }

    UIPreset:
      type: string
      enum: [none, large_text, large_button, simple_screen, step_guide, voice_guide]
      description: none=화면 유지, 큰 글씨, 큰 버튼, 간편 화면, 단계별 안내, 음성 안내

    SupportDecision:
      type: object
      required: [preset, requires_confirmation, decided_by]
      properties:
        preset: { $ref: "#/components/schemas/UIPreset" }
        requires_confirmation: { type: boolean, description: true면 사용자 확인 후 적용 }
        decided_by: { type: string, enum: [rule_placeholder, jev], description: Jev 연동 전에는 rule_placeholder }

    FeatureWindowResponse:
      type: object
      required: [session_id, ai_available, support]
      properties:
        session_id: { type: string }
        ai_available: { type: boolean, description: ai-server 호출 실패 시 false }
        states:
          oneOf:
            - $ref: "#/components/schemas/StateScores"
            - type: "null"
        model_version: { type: [string, "null"] }
        support: { $ref: "#/components/schemas/SupportDecision" }

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
